# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Faithful reproduction of Table 1
sharing: false

providers:
  - file://notebook-provider.mjs

prompts:
  - '{{prompt}}'

tests: file://table_test_cases.csv

defaultTest:
  assert:
    - type: javascript
      metric: Table 1 matches the source
      value: |
        const expected = JSON.parse(context.vars.expected_table);
        const matches = output.tables.some(
          (table) => JSON.stringify(table) === JSON.stringify(expected)
        );
        return {
          pass: matches,
          score: matches ? 1 : 0,
          reason: matches
            ? 'Table headers, labels, values, and units match'
            : 'Expected ' + JSON.stringify(expected) + '; observed ' + JSON.stringify(output.tables),
        };
