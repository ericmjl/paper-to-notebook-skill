# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Faithful reproduction of Table 1
sharing: false

providers:
  - file://notebook-provider.mjs

prompts:
  - '{{prompt}}'

tests: file://table_test_cases.csv

defaultTest:
  assert:
    - type: javascript
      metric: Table accuracy verdict is correct
      value: |
        if (!output.tables.length) {
          return { pass: false, score: 0, reason: 'No supported table output found' };
        }
        const expected = context.metadata.answer_key;
        const expectsMatch = String(context.vars.expected_match) === 'true';
        const matches = output.tables.some(
          (table) => JSON.stringify(table) === JSON.stringify(expected)
        );
        if (matches === expectsMatch) {
          const reason = expectsMatch ? 'Table matches the answer key' : 'Swapped group values correctly rejected';
          return { pass: true, score: 1, reason };
        }
        const reason = expectsMatch
          ? 'Expected ' + JSON.stringify(expected) + '; observed ' + JSON.stringify(output.tables)
          : 'Negative control unexpectedly matched the answer key';
        return { pass: false, score: 0, reason };
